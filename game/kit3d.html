<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3D 素材库预览</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html, body { margin: 0; height: 100%; background: #bfe6f2; overflow: hidden; } canvas { display: block; width: 100vw; height: 100vh; }</style>
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<!-- Dev tool (docs/14): every model of the 3D map kit side by side, lit like the game.
     ?keys=bld_cottage,tent  only these   ?night=1  night lighting   ?cols=4  per row   ?gap=260  spacing -->
<script type="module">
import * as THREE from 'three';
import { makeKit } from './src/view3d/kit/flora.js';
import { TIME } from './src/view3d/kit/shared.js';
import { SUN_DIR } from './src/view3d/kit/terrain.js';

const q = new URLSearchParams(location.search);
const night = q.has('night');
const kit = makeKit();
const keys = (q.get('keys') ?? Object.keys(kit.protos).join(',')).split(',').filter((k) => kit.has(k));
const cols = Number(q.get('cols')) || Math.ceil(Math.sqrt(keys.length * 1.6)), gap = Number(q.get('gap')) || 250;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(night ? 0x1b2440 : 0xbfe6f2);
scene.add(new THREE.HemisphereLight(night ? 0x44508a : 0xe6f4ff, 0x86b24a, night ? 0.5 : 1.5));
const sun = new THREE.DirectionalLight(0xffe9c4, night ? 0.15 : 3.3);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x86c452, roughness: 1 }));
ground.receiveShadow = true; scene.add(ground);
kit.setNight(night ? 1 : 0);

const rows = Math.ceil(keys.length / cols);
keys.forEach((key, i) => {
  const variants = kit.protos[key].length, cx = (i % cols - (cols - 1) / 2) * gap, cz = (Math.floor(i / cols) - (rows - 1) / 2) * gap;
  const m = kit.instantiate(key, Number(q.get('v')) || 0);
  m.position.set(cx, 0, cz); scene.add(m);
  if (night && (key === 'lamp' || key === 'campfire_lit')) { const l = new THREE.PointLight(0xffc27a, 4.4, 320, 0); l.position.set(cx, 70, cz); scene.add(l); }
  void variants;
});
const w = Math.max(cols * gap, rows * gap * 1.9), dist = (w * 0.62 + 120) * (Number(q.get('zoom')) || 1);
const camera = new THREE.PerspectiveCamera(42, 1, 10, 9000);
const yaw = Number(q.get('yaw')) || 0;
camera.position.set(Math.sin(yaw) * dist * 0.84, dist * 0.53 + 40, Math.cos(yaw) * dist * 0.84);
camera.lookAt(0, 50, 0);
sun.position.copy(SUN_DIR).multiplyScalar(1200); sun.target.position.set(0, 0, 0);
const sc = sun.shadow.camera; sc.left = -w; sc.right = w; sc.top = w; sc.bottom = -w; sc.near = 10; sc.far = 4000; sun.shadow.normalBias = 1.2;
function size() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', size); size();
renderer.setAnimationLoop((t) => { TIME.value = t / 1000; renderer.render(scene, camera); window.__frames = (window.__frames ?? 0) + 1; });
</script>
</body>
</html>
