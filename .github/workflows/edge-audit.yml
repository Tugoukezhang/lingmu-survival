name: Inspect Lingmu edge artifacts
on:
  push:
    branches: [main]
    paths:
      - 'art/qa/edge_audit.py'
      - '.github/workflows/edge-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check Pillow==11.2.1 numpy
      - run: python art/qa/edge_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lingmu-edge-review
          path: edge-qa/
