name: Create reference-matched dune lighthouse on-state
on:
  push:
    paths:
      - '.github/workflows/build-lighthouse.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  relight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.2.1 numpy==2.2.5
      - name: Build on-state from original off-state pixels
        run: python art/qa/build_lighthouse_on.py
      - name: Commit 1024x1536 PNG and inspection preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/incoming/prop_lighthouse_dune_on.png art/qa/preview_dune_on.png art/qa/preview_dune_on.json
          if ! git diff --cached --quiet; then
            git commit -m 'art: deliver #96 same-source dune lighthouse lit state'
            git push origin HEAD:main
          fi
