name: Inspect source lighthouse pixels
on:
  push:
    paths:
      - '.github/workflows/inspect-lighthouse.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.2.1
      - name: Extract source preview and alpha stats, no art modifications
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from PIL import Image
          p=Path('art/incoming/prop_lighthouse_dune_off.png')
          raw=p.read_bytes()
          with Image.open(p) as im:
              im=im.convert('RGBA')
              bbox=im.getchannel('A').getbbox()
              mini=im.copy()
              mini.thumbnail((320,480),Image.Resampling.LANCZOS)
              out=Path('art/qa/preview_dune_off.png')
              out.parent.mkdir(parents=True,exist_ok=True)
              mini.save(out,optimize=True)
              data={'filename':str(p),'sha256':hashlib.sha256(raw).hexdigest(),'size':list(im.size),'bbox':bbox,'alpha_range':im.getchannel('A').getextrema(),'preview_size':list(mini.size)}
              Path('art/qa/preview_dune_off.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
              print(data)
          PY
      - name: Save preview for visual assessment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/qa/preview_dune_off.png art/qa/preview_dune_off.json
          if ! git diff --cached --quiet; then
            git commit -m "art QA: expose 320px preview of source dune lighthouse for reference"
            git push origin HEAD:main
          fi
