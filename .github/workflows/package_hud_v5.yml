name: Package HUD V5 individual review sprites (one time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/package_hud_v5.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip individual GPT Image candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          base=Path("game/assets/ui/hud_v5_handpaint_review")
          manifest=json.loads((base/"candidate_manifest.json").read_text())
          files=[base/p["path"] for p in manifest["candidate_files"]]
          assert len(files)==10 and all(x.exists() for x in files)
          out=base/"HUD_V5_10_GPT_Image_Candidates.zip"
          with ZipFile(out,"w",ZIP_DEFLATED,compresslevel=6) as z:
              for f in files: z.write(f,f.relative_to(base))
              for n in ("candidate_manifest.json","production_status.json","candidate_contact_sheet.jpg","README.md"):
                  z.write(base/n,n)
          with ZipFile(out) as z:
              assert z.testzip() is None
              print("ZIP complete",len(z.namelist()),"files",out.stat().st_size,"bytes")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/ui/hud_v5_handpaint_review/HUD_V5_10_GPT_Image_Candidates.zip
          if ! git diff --cached --quiet; then
             git commit -m "Package 10 independently generated HUD V5 review candidates"
             git push origin HEAD:main
          fi
